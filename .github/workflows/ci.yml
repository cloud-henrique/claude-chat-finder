name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes whatever was still running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Type checking and linting are platform-independent, so they run once.
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  # Tests run everywhere: this is the project's only automated check that the
  # per-OS path resolution, bun:sqlite and the compiled-in FTS5 all behave the
  # same on the three targets we ship binaries for.
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test

      # The TUI needs a real terminal, so CI can't drive it. What it can prove
      # on every OS is that the entry point loads and refuses cleanly instead
      # of crashing — which is also the guard a user hits when piping output.
      - name: Entry point refuses a non-interactive terminal
        shell: bash
        run: |
          set +e
          output=$(bun run src/cli.tsx </dev/null 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::expected exit code 1, got $status"
            exit 1
          fi
          case "$output" in
            *"needs an interactive terminal"*) ;;
            *) echo "::error::the TTY guard message is missing"; exit 1 ;;
          esac
